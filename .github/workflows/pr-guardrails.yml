# Deterministic PR rules (AGENTS.md §2 and lesson L-005). Reads only PR metadata through the API: no checkout, no
# PR code executed, read-only token.
#   - Title: Conventional Commits (it becomes the squash commit message)
#   - Exactly one type label: spec | implementation | process | dependencies
#   - L-005: changes to agents, skills, prompts, instructions, hooks, workflows, AGENTS.md, scripts/ or the SDD config
#     require the `process` label (Dependabot may bump workflow actions with `dependencies`)
#   - `spec` PRs only touch openspec/changes/ and docs/adr/
#   - Size: production lines (src/**, excluding migrations and generated code) warn > 400, fail > 800
name: PR guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR rules
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const errors = [];
            const warnings = [];
            const checks = [];

            const titleOk = /^(feat|fix|docs|test|refactor|perf|style|build|ci|chore|spec|revert)(\([a-z0-9][a-z0-9-]*\))?!?: \S.+$/.test(pr.title);
            checks.push(['Título Conventional Commits', titleOk, pr.title]);
            if (!titleOk) errors.push('El título debe seguir Conventional Commits, p. ej. `feat(bookings): crear reserva (add-create-booking)`.');

            const typeLabels = ['spec', 'implementation', 'process', 'dependencies'];
            const labels = pr.labels.map((l) => l.name);
            const types = labels.filter((l) => typeLabels.includes(l));
            checks.push(['Un label de tipo', types.length === 1, types.join(', ') || '—']);
            if (types.length !== 1) errors.push(`Debe tener exactamente un label de tipo (${typeLabels.join(' | ')}); tiene: ${types.join(', ') || 'ninguno'}.`);

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const names = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));

            const processPath = /^(AGENTS\.md|\.github\/(agents|skills|prompts|instructions|hooks|workflows)\/|\.github\/copilot-instructions\.md$|scripts\/|\.sdd\/sdd\.config\.json$)/;
            const touched = [...new Set(names.filter((n) => processPath.test(n)))];
            const isDependabot = pr.user.login === 'dependabot[bot]';
            const processOk = touched.length === 0 || labels.includes('process') || (isDependabot && labels.includes('dependencies') && touched.every((n) => n.startsWith('.github/workflows/')));
            checks.push(['L-005 · rutas del proceso con label `process`', processOk, touched.length ? `${touched.length} fichero(s)` : 'no toca rutas del proceso']);
            if (!processOk) errors.push(`Toca ficheros del proceso SDD y necesita el label \`process\` (lección L-005): ${touched.slice(0, 10).join(', ')}${touched.length > 10 ? '…' : ''}`);

            if (labels.includes('spec')) {
              const outside = names.filter((n) => !/^(openspec\/changes\/|docs\/adr\/)/.test(n));
              checks.push(['PR de spec solo con artefactos de spec', outside.length === 0, outside.length ? `${outside.length} fichero(s) fuera` : 'OK']);
              if (outside.length) errors.push(`Una PR de spec solo puede tocar openspec/changes/ y docs/adr/: ${outside.slice(0, 10).join(', ')}`);
            }

            const production = files.filter((f) => /^src\//.test(f.filename) && !/\/Migrations\//.test(f.filename) && !/\.(Designer|g)\.cs$/.test(f.filename));
            const size = production.reduce((n, f) => n + f.additions + f.deletions, 0);
            checks.push(['Tamaño (líneas de producción)', size <= 800, `${size} (aviso > 400, fallo > 800)`]);
            if (size > 800) errors.push(`La PR cambia ${size} líneas de producción (> 800). Divide el change.`);
            else if (size > 400) warnings.push(`La PR cambia ${size} líneas de producción (> 400): justifícalo en la descripción.`);

            const esc = (s) => String(s).replace(/\|/g, '\\|').replace(/@/g, '@\u200b');
            await core.summary
              .addHeading('🛡️ PR guardrails', 2)
              .addRaw(['| Regla | Estado | Detalle |', '|---|---|---|', ...checks.map(([r, ok, d]) => `| ${r} | ${ok ? '✅' : '❌'} | ${esc(d)} |`)].join('\n') + '\n\n')
              .addRaw(warnings.map((w) => `> ⚠️ ${w}`).join('\n') + '\n')
              .write();
            warnings.forEach((w) => core.warning(w));
            if (errors.length) core.setFailed(errors.join('\n'));

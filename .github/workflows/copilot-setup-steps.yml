# Generated by OpenSpec for GitHub Copilot coding agent support.
# Customized: pinned OpenSpec version and added the .NET 10 SDK so the cloud agent can build and test.
# NOTE: because this file is customized, `openspec update` leaves it untouched; bump versions here manually.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install OpenSpec CLI (pinned)
        run: npm install -g @fission-ai/openspec@1.14.2

      - name: Verify toolchain
        run: |
          dotnet --version
          openspec --version
          openspec validate --all --strict

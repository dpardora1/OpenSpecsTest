# Same quality gate as local (scripts/quality-gate.ps1): process files, PowerShell, Pester, OpenSpec and, once the
# .NET solution exists, build without warnings, format, tests with coverage and scenario traceability.
# Read-only token: this job runs code from the PR branch, so it gets no write permissions and no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for the diff against main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install OpenSpec CLI (pinned)
        run: npm install -g @fission-ai/openspec@1.14.2

      - name: Install Pester 5
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge ([version]'5.5.0'))) {
            Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Quality gate
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          $change = $null
          if ($env:HEAD_REF -match '^sdd/([a-z0-9]+(-[a-z0-9]+)*)$' -and (Test-Path "openspec/changes/$($Matches[1])")) { $change = $Matches[1] }
          $gateArgs = @{ Base = 'origin/main'; ResultsDir = "$env:RUNNER_TEMP/quality-gate"; OutFile = "$env:RUNNER_TEMP/quality-gate/summary.md" }
          if ($change) { $gateArgs.Change = $change }
          New-Item -ItemType Directory -Force $gateArgs.ResultsDir | Out-Null
          ./scripts/quality-gate.ps1 @gateArgs

      - name: Upload quality gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-gate
          path: ${{ runner.temp }}/quality-gate
          retention-days: 14
          if-no-files-found: ignore

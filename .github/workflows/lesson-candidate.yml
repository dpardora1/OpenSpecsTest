# Captures the human approver's review feedback as "lesson-candidate" Issues, so the retrospective agent
# can turn it into lessons or approver preferences (.sdd/memory). Only reviews written by the approver count.
name: Lesson candidates from reviews

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  capture:
    if: github.event.review.user.login == 'dpardora1' && (github.event.review.state == 'changes_requested' || github.event.review.state == 'commented' || github.event.review.body != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create lesson-candidate issue
        uses: actions/github-script@v7
        with:
          script: |
            const review = context.payload.review;
            const pr = context.payload.pull_request;
            const { data: comments } = await github.rest.pulls.listCommentsForReview({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: pr.number, review_id: review.id, per_page: 100,
            });
            const body = (review.body || '').trim();
            if (!body && comments.length === 0) {
              core.info('Review without text: nothing to capture.');
              return;
            }
            const quote = (t) => t.split('\n').map((l) => `> ${l}`).join('\n');
            const lines = [
              `Revisión de @${review.user.login} en #${pr.number} (**${review.state}**): ${review.html_url}`,
              '',
              `PR: ${pr.title}`,
              '',
            ];
            if (body) lines.push('### Comentario general', '', quote(body), '');
            if (comments.length) {
              lines.push('### Comentarios en línea', '');
              for (const c of comments) {
                lines.push(`- \`${c.path}${c.line ? ':' + c.line : ''}\` — ${c.html_url}`, '', quote(c.body), '');
              }
            }
            lines.push('---', '_Lo procesará el agente `retrospective` (skill `capture-lessons`) y lo cerrará enlazando la lección o preferencia resultante._');
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[lesson-candidate] Feedback en #${pr.number}: ${pr.title}`.slice(0, 250),
              body: lines.join('\n'),
              labels: ['lesson-candidate'],
            });
            core.info(`Created ${issue.html_url}`);
